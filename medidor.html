<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Master Layout Pro - Ultimate Engine V3</title>
<style>
  :root { 
    --bg-app: #0f111a; --bg-panel: #1a1d27; --bg-light: #282c3a;
    --text-main: #f8fafc; --text-muted: #94a3b8;
    --accent: #10b981; --accent-hover: #059669; --accent-blue: #3b82f6;
    --border: #334155; 
  }
  * { box-sizing: border-box; }
  body, html { margin: 0; padding: 0; height: 100%; font-family: system-ui, -apple-system, sans-serif; background: var(--bg-app); color: var(--text-main); overflow: hidden; }

  /* HEADER */
  header { background: #0b0d14; padding: 10px 20px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; z-index: 100; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
  .logo h1 { margin: 0; font-size: 16px; font-weight: 800; background: linear-gradient(90deg, #10b981, #3b82f6); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
  .logo p { margin: 0; font-size: 10px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 1px; }
  
  .controls-center { display: flex; gap: 10px; background: #1a1d27; padding: 5px; border-radius: 6px; border: 1px solid var(--border); }
  .controls-center button { background: transparent; border: none; color: var(--text-muted); padding: 5px 12px; cursor: pointer; border-radius: 4px; font-size: 11px; font-weight: bold; transition: 0.2s;}
  .controls-center button.active { background: var(--border); color: #fff; }
  
  .top-actions button { background: var(--accent-blue); color: white; border: none; padding: 8px 16px; border-radius: 4px; font-size: 11px; font-weight: bold; cursor: pointer; transition: 0.2s; }
  .top-actions button:hover { background: #2563eb; }
  
  /* LAYOUT */
  .workspace { display: flex; flex: 1; height: calc(100vh - 55px); }
  
  /* SIDEBAR CON BUSCADOR */
  .sidebar { width: 300px; background: var(--bg-panel); border-right: 1px solid var(--border); display: flex; flex-direction: column; }
  .search-box { padding: 15px; border-bottom: 1px solid var(--border); background: #14171f; }
  .search-box input { width: 100%; padding: 10px; background: #0f111a; border: 1px solid var(--border); color: #fff; border-radius: 6px; font-size: 12px; outline: none; }
  .search-box input:focus { border-color: var(--accent); }
  
  .catalog-scroll { flex: 1; overflow-y: auto; }
  .catalog-scroll::-webkit-scrollbar { width: 5px; } .catalog-scroll::-webkit-scrollbar-thumb { background: #475569; }
  .cat-section { padding: 15px 15px 0 15px; }
  .cat-title { font-size: 10px; text-transform: uppercase; color: #cbd5e1; margin: 0 0 10px 0; border-bottom: 1px solid var(--border); padding-bottom: 5px; font-weight: 700; letter-spacing: 0.5px;}
  .tool-btn { width: 100%; background: #1e293b; color: #cbd5e1; border: 1px solid var(--border); padding: 8px 10px; border-radius: 4px; cursor: pointer; text-align: left; font-size: 11px; margin-bottom: 6px; transition: 0.2s; display: flex; justify-content: space-between; align-items: center; }
  .tool-btn:hover { background: #334155; border-color: var(--accent); color: #fff; }
  .tool-tag { font-size: 9px; background: #0f172a; padding: 2px 5px; border-radius: 3px; color: #94a3b8; }

  /* CANVAS ENGINE */
  .canvas-wrapper { flex: 1; display: flex; justify-content: center; align-items: center; background-image: radial-gradient(#334155 1px, transparent 0); background-size: 20px 20px; overflow: auto; padding: 20px; position: relative; }
  #canvas { position: relative; box-shadow: 0 20px 60px rgba(0,0,0,0.9); transition: width 0.3s, height 0.3s; perspective: 1500px; }
  #canvas.desktop { width: 100%; height: 100%; min-height: 800px; }
  #canvas.tablet { width: 768px; height: 1024px; border-radius: 4px; }
  #canvas.mobile { width: 375px; height: 667px; border-radius: 30px; border: 12px solid #0f172a; }
  .canvas-bg { position: absolute; inset: 0; z-index: 0; transition: background 0.3s, opacity 0.3s; }

  /* ELEMENTS IN CANVAS */
  .element { position: absolute; box-sizing: border-box; display: flex; overflow: visible; }
  
  body.edit-mode .element { cursor: grab; }
  body.edit-mode .element:active { cursor: grabbing; }
  body.edit-mode .inner-content { pointer-events: none !important; } 
  body.interact-mode .element { cursor: default; }
  body.interact-mode .resizer { display: none !important; }
  body.interact-mode .element.selected { outline: none; }
  
  .element.selected { outline: 2px solid var(--accent); outline-offset: 1px; z-index: 99999; }
  .resizer { width: 12px; height: 12px; background: var(--accent); position: absolute; right: -6px; bottom: -6px; cursor: nwse-resize; display: none; z-index: 9999; border-radius: 50%; box-shadow: 0 0 5px rgba(0,0,0,0.5);}
  .element.selected .resizer { display: block; }
  .inner-content { width: 100%; height: 100%; display: flex; }

  /* RIGHT PANEL */
  .right-panel { width: 360px; background: var(--bg-panel); border-left: 1px solid var(--border); display: flex; flex-direction: column; }
  .tabs { display: flex; border-bottom: 1px solid var(--border); background: #0b0d14; }
  .tab-btn { flex: 1; padding: 12px 0; background: transparent; border: none; color: var(--text-muted); cursor: pointer; font-size: 10px; font-weight: bold; transition: 0.2s; border-bottom: 2px solid transparent; text-transform: uppercase; }
  .tab-btn.active { color: #fff; border-bottom: 2px solid var(--accent); background: var(--bg-panel); }
  .tab-content { flex: 1; overflow-y: auto; display: none; }
  .tab-content.active { display: block; }

  /* CONTROLES DE ALINEACIÓN (ESTILO OBS) */
  .obs-controls { display: flex; justify-content: space-between; background: #0f172a; padding: 8px; border-radius: 6px; border: 1px solid #334155; margin-bottom: 15px;}
  .obs-controls button { flex: 1; background: transparent; color: #cbd5e1; border: none; font-size: 16px; cursor: pointer; padding: 5px; border-radius: 4px; transition: 0.2s; }
  .obs-controls button:hover { background: #334155; color: #fff; }

  /* PROPIEDADES UI */
  .props-container { padding: 15px; }
  .prop-section { margin-bottom: 15px; background: #1e293b; padding: 12px; border-radius: 6px; border: 1px solid var(--border); }
  .prop-section h4 { margin: 0 0 12px 0; font-size: 10px; color: #cbd5e1; text-transform: uppercase; letter-spacing: 0.5px;}
  .prop-row { display: flex; gap: 10px; margin-bottom: 10px; }
  .prop-group { flex: 1; display: flex; flex-direction: column; }
  .prop-group label { font-size: 9px; color: #94a3b8; margin-bottom: 4px; text-transform: uppercase; }
  .prop-group input, .prop-group select, .prop-group textarea { width: 100%; padding: 6px; border-radius: 4px; border: 1px solid #475569; background: #0f172a; color: white; font-family: monospace; font-size: 11px; outline: none;}
  .prop-group input:focus, .prop-group textarea:focus { border-color: var(--accent); }
  .prop-group input[type="color"] { padding: 0; height: 26px; cursor: pointer; border: none; }
  
  /* CÓDIGO */
  .code-section { margin: 15px; background: #0f172a; border-radius: 6px; border: 1px solid var(--border); overflow: hidden; }
  .code-header { background: #0b0d14; padding: 8px 12px; font-size: 10px; font-weight: bold; color: #94a3b8; border-bottom: 1px solid var(--border); text-transform: uppercase;}
  pre { margin: 0; padding: 12px; font-family: 'Courier New', monospace; font-size: 11px; line-height: 1.5; white-space: pre-wrap; max-height: 300px; overflow-y: auto;}
  .html-code { color: #e6db74; } .css-code { color: #66d9ef; }

</style>
<style id="dynamic-css"></style>
</head>
<body class="edit-mode">

  <header>
    <div class="logo">
      <h1>Master Layout Pro</h1>
      <p>La Herramienta Web Definitiva</p>
    </div>
    <div class="controls-center">
      <button class="active" id="btn-edit" onclick="setMode('edit')">🛠️ Modo Edición</button>
      <button id="btn-interact" onclick="setMode('interact')">🖱️ Probar Interactividad</button>
    </div>
    <div class="viewports" id="viewport-controls">
      <button class="active" onclick="setViewport('desktop')">PC</button>
      <button onclick="setViewport('tablet')">Tablet</button>
      <button onclick="setViewport('mobile')">Móvil</button>
    </div>
    <div class="top-actions">
      <button onclick="downloadProject()">⬇ Exportar Proyecto ZIP</button>
    </div>
  </header>

  <div class="workspace">
    
    <!-- SIDEBAR (BUSCADOR Y CATÁLOGO) -->
    <div class="sidebar">
      <div class="search-box">
        <input type="text" id="cat-search" placeholder="🔍 Buscar elemento (ej. 'slider', 'card')..." oninput="filterSidebar()">
      </div>
      <div class="catalog-scroll" id="sidebar-content"></div>
    </div>

    <!-- CANVAS -->
    <div class="canvas-wrapper" id="canvas-wrapper">
      <div id="canvas" class="desktop">
        <div class="canvas-bg" id="canvas-bg"></div>
      </div>
    </div>

    <!-- PANEL DERECHO -->
    <div class="right-panel">
      <div class="tabs">
        <button class="tab-btn active" onclick="switchTab('props')">Diseño & OBS</button>
        <button class="tab-btn" onclick="switchTab('html')">HTML</button>
        <button class="tab-btn" onclick="switchTab('css')">CSS</button>
      </div>

      <!-- TAB: PROPIEDADES -->
      <div id="tab-props" class="tab-content active">
        <div class="props-container">
          
          <div id="canvas-props" style="display: block;">
            <div style="text-align: center; margin-bottom: 15px; font-size: 11px; color: var(--accent);">⚙️ Lienzo (Clic al fondo)</div>
            <div class="prop-section">
              <div class="prop-group" style="margin-bottom:10px;"><label>Color Fondo (Lienzo)</label><input type="color" id="canvas-color" value="#1a1d27" oninput="updateCanvas()"></div>
              <div class="prop-group"><label>Opacidad Lienzo (%)</label><input type="number" id="canvas-opacity" value="5" min="0" max="100" oninput="updateCanvas()"></div>
            </div>
          </div>

          <div id="layer-props" style="display: none;">
            
            <!-- ALINEACIÓN ESTILO OBS -->
            <div class="obs-controls">
              <button onclick="obsAlign('centerH')" title="Centrar Horizontalmente">↔</button>
              <button onclick="obsAlign('centerV')" title="Centrar Verticalmente">↕</button>
              <button onclick="obsAlign('stretchW')" title="Estirar al 100% del Ancho">⇹</button>
              <button onclick="obsAlign('stretchH')" title="Estirar al 100% del Alto">⇕</button>
              <button onclick="obsAlign('fit')" title="Llenar Lienzo Completo">🔲</button>
            </div>

            <div class="prop-section">
              <h4>Dimensiones & Posición</h4>
              <div class="prop-row">
                <div class="prop-group"><label>X (Left)</label><input type="number" id="prop-x" oninput="updateElUI()"></div>
                <div class="prop-group"><label>Y (Top)</label><input type="number" id="prop-y" oninput="updateElUI()"></div>
              </div>
              <div class="prop-row">
                <div class="prop-group"><label>Ancho (W)</label><input type="number" id="prop-w" oninput="updateElUI()"></div>
                <div class="prop-group"><label>Alto (H)</label><input type="number" id="prop-h" oninput="updateElUI()"></div>
              </div>
            </div>

            <div class="prop-section">
              <h4>Apariencia & Texto</h4>
              <div class="prop-group" style="margin-bottom:10px;"><label>Fondo (Color / Gradient / Imagen URL)</label><input type="text" id="prop-bg" oninput="updateElUI()"></div>
              <div class="prop-row">
                <div class="prop-group"><label>Color Texto</label><input type="color" id="prop-color" oninput="updateElUI()"></div>
                <div class="prop-group"><label>Bordes (px)</label><input type="number" id="prop-radius" oninput="updateElUI()"></div>
              </div>
              <div class="prop-group">
                <label>HTML Interno / Contenido</label>
                <textarea id="prop-text" oninput="updateElUI()" rows="3"></textarea>
              </div>
            </div>

            <div class="prop-section">
              <h4>Transformaciones 3D & Estilos</h4>
              <div class="prop-row">
                <div class="prop-group"><label>Rotación Z (2D)</label><input type="number" id="prop-rotZ" oninput="updateElUI()"></div>
                <div class="prop-group"><label>Rotación Y (3D)</label><input type="number" id="prop-rotY" oninput="updateElUI()"></div>
              </div>
              
              <div class="prop-group" style="margin-top:10px;">
                <label>Estilo Visual Especial</label>
                <select id="prop-style" oninput="updateElUI()">
                  <option value="none">Normal</option>
                  <option value="neumorphism">Neumorfismo (Relieve)</option>
                  <option value="glass">Glassmorfismo (Cristal Blur)</option>
                  <option value="cyberpunk">Cyberpunk (Glitch & Neón)</option>
                  <option value="skeleton">Skeleton Loader (Cargando)</option>
                </select>
              </div>
            </div>

            <div class="prop-section">
              <h4>Interactividad & Funciones</h4>
              <div class="prop-group" style="margin-bottom:10px;">
                <label>Lógica Funcional (CSS Puro)</label>
                <select id="prop-func" oninput="updateElUI()">
                  <option value="none">Ninguno (Estático)</option>
                  <option value="hover-flip">Tarjeta Flip 3D (Hover)</option>
                  <option value="hover-dropdown">Menú Desplegable (Hover)</option>
                  <option value="tooltip">Tooltip (Globo Hover)</option>
                  <option value="css-carousel">Carrusel Automático</option>
                </select>
              </div>
              <div class="prop-group">
                <label>Animación Continua</label>
                <select id="prop-anim" oninput="updateElUI()">
                  <option value="none">Ninguna</option>
                  <option value="float">Flotar Suave (Float)</option>
                  <option value="pulse">Latir (Pulse)</option>
                  <option value="spin">Rotar 3D Infinito</option>
                </select>
              </div>
            </div>

          </div>
        </div>
      </div>

      <!-- TAB: HTML & CSS -->
      <div id="tab-html" class="tab-content">
        <div class="code-section"><div class="code-header">Toda la Estructura</div><pre class="html-code" id="code-html-global"></pre></div>
        <div class="code-section"><div class="code-header" style="color:var(--accent);">Capa Seleccionada</div><pre class="html-code" id="code-html-single"></pre></div>
      </div>
      <div id="tab-css" class="tab-content">
        <div class="code-section"><div class="code-header">Estilos Globales</div><pre class="css-code" id="code-css-global"></pre></div>
        <div class="code-section"><div class="code-header" style="color:var(--accent);">Capa Seleccionada</div><pre class="css-code" id="code-css-single"></pre></div>
      </div>

    </div>
  </div>

  // INICIALIZACIÓN SIDEBAR
  function buildSidebar() {
    const sb = document.getElementById('sidebar-content');
    sb.innerHTML = '';
    catalogue.forEach(cat => {
      let html = `<div class="cat-section" data-cat="${cat.cat.toLowerCase()}"><h3 class="cat-title">${cat.cat}</h3>`;
      cat.items.forEach(i => { html += `<button class="tool-btn" data-name="${i.n.toLowerCase()} ${i.id.toLowerCase()}" onclick="addElement('${i.id}')">${i.n} <span class="tool-tag">+</span></button>`; });
      sb.innerHTML += html + `</div>`;
    });
  }
  buildSidebar();

  // BUSCADOR EN TIEMPO REAL
  function filterSidebar() {
    const query = document.getElementById('cat-search').value.toLowerCase();
    const sections = document.querySelectorAll('.cat-section');
    sections.forEach(sec => {
      let hasVisible = false;
      const btns = sec.querySelectorAll('.tool-btn');
      btns.forEach(btn => {
        if (btn.getAttribute('data-name').includes(query)) {
          btn.style.display = 'flex';
          hasVisible = true;
        } else {
          btn.style.display = 'none';
        }
      });
      sec.style.display = hasVisible ? 'block' : 'none';
    });
  }

  // ALINEACIÓN ESTILO OBS
  function obsAlign(action) {
    if(!selectedId) return;
    const el = elements.find(e => e.id === selectedId);
    const cw = canvas.offsetWidth;
    const ch = canvas.offsetHeight;
    
    if(action === 'centerH') el.x = (cw - el.w) / 2;
    if(action === 'centerV') el.y = (ch - el.h) / 2;
    if(action === 'stretchW') { el.x = 0; el.w = cw; }
    if(action === 'stretchH') { el.y = 0; el.h = ch; }
    if(action === 'fit') { el.x = 0; el.y = 0; el.w = cw; el.h = ch; }
    
    // Forzar actualización al input y al motor
    document.getElementById('prop-x').value = el.x;
    document.getElementById('prop-y').value = el.y;
    document.getElementById('prop-w').value = el.w;
    document.getElementById('prop-h').value = el.h;
    updateElUI();
  }

  // MODO EDICIÓN VS INTERACTIVO
  function setMode(mode) {
    document.body.className = `${mode}-mode`;
    document.getElementById('btn-edit').className = mode === 'edit' ? 'active' : '';
    document.getElementById('btn-interact').className = mode === 'interact' ? 'active' : '';
    if(mode === 'interact') selectElement(null); 
  }

  // 1. AÑADIR CAPA
  function addElement(tKey) {
    let t = null; catalogue.forEach(c => { const f = c.items.find(i => i.id === tKey); if(f) t = f; });
    if(!t) return;

    const id = `el_${counter++}`;
    let sX = Math.max(0, (canvas.offsetWidth / 2) - (t.w / 2));
    let sY = Math.max(50, (canvas.offsetHeight / 2) - (t.h / 2));
    if(t.fullW) { sX = 0; sY = (t.t==='header') ? 0 : sY; } // Auto-posicion headers/footers

    const newEl = { 
      id, name: `${t.n} ${counter-1}`, tag: t.t, attrs: t.attrs || '',
      x: sX, y: sY, w: t.w, h: t.h, 
      bg: t.bg, color: t.c, text: t.txt, radius: t.r || 0, 
      fs: t.fs || 14, opacity: 100, rotY: 0, rotZ: 0, 
      style: t.style || 'none', func: t.func || 'none', anim: 'none', clip: t.clip || 'none'
    };
    
    elements.push(newEl);
    
    const node = document.createElement('div');
    node.id = id; node.className = 'element';
    node.innerHTML = `<div class="inner-content"></div><div class="resizer"></div>`;
    
    node.addEventListener('mousedown', (e) => { 
      if(document.body.classList.contains('interact-mode')) return;
      if(e.target.classList.contains('resizer')) return; 
      selectElement(id); startDrag(e, newEl, node); 
    });
    
    const resizer = node.querySelector('.resizer');
    resizer.addEventListener('mousedown', (e) => { 
      if(document.body.classList.contains('interact-mode')) return;
      e.stopPropagation(); selectElement(id); startResize(e, newEl, node); 
    });
    
    canvas.appendChild(node);
    applyStylesAndCompile(); 
    selectElement(id);
  }

  // 2. APLICADOR HÍBRIDO (El cerebro)
  function applyStylesAndCompile() {
    let globalDynamicCSS = ""; 

    elements.forEach((el, idx) => {
      const node = document.getElementById(el.id);
      if(!node) return;
      node.style.zIndex = idx + 1;
      
      // Inline
      node.style.left = `${el.x}px`; node.style.top = `${el.y}px`;
      node.style.width = `${el.w}px`; node.style.height = `${el.h}px`;
      
      // CSS Dinámico
      let cBlock = `.${el.id} {\n  background: ${el.bg};\n  color: ${el.color};\n  border-radius: ${el.radius}px;\n  opacity: ${el.opacity/100};\n  transition: all 0.3s ease;\n  transform: rotateZ(${el.rotZ}deg) rotateY(${el.rotY}deg);\n`;
      if(el.clip !== 'none') cBlock += `  clip-path: ${el.clip};\n`;
      
      // Estilos Extremos
      if(el.style === 'shadow') cBlock += `  box-shadow: 0 10px 30px rgba(0,0,0,0.15);\n`;
      else if(el.style === 'neumorphism') cBlock += `  box-shadow: 8px 8px 16px #c5c9d1, -8px -8px 16px #ffffff;\n  display: flex; align-items: center; justify-content: center; font-weight: bold; border:none;\n`;
      else if(el.style === 'glass') cBlock += `  backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px);\n  box-shadow: 0 8px 32px 0 rgba(0,0,0,0.2);\n  border: 1px solid rgba(255,255,255,0.18);\n`;
      else if(el.style === 'neon') cBlock += `  text-shadow: 0 0 5px ${el.bg}, 0 0 20px ${el.bg};\n  box-shadow: 0 0 10px ${el.bg}, inset 0 0 10px ${el.bg};\n  border: 2px solid ${el.bg}; display: flex; align-items: center; justify-content: center; font-weight: 900; letter-spacing: 2px; color: ${el.color};\n`;
      else if(el.style === 'cyberpunk') cBlock += `  background: linear-gradient(45deg, transparent 5%, ${el.bg} 5%);\n  box-shadow: 6px 0px 0px #00e6f6;\n  display: flex; align-items: center; justify-content: center; font-weight: 900; letter-spacing: 3px; border: none; outline: transparent; clip-path: polygon(0 0, 100% 0, 100% 100%, 8% 100%, 0 80%);\n`;
      else if(el.style === 'skeleton') cBlock += `  background: linear-gradient(90deg, #e2e8f0 25%, #cbd5e1 50%, #e2e8f0 75%);\n  background-size: 200% 100%;\n  animation: skeletonLoad 1.5s infinite linear;\n`;

      // Animaciones 
      if(el.anim === 'float') cBlock += `  animation: animFloat 3s ease-in-out infinite;\n`;
      if(el.anim === 'pulse') cBlock += `  animation: animPulse 2s infinite;\n`;
      if(el.anim === 'spin') cBlock += `  animation: animSpin 4s linear infinite;\n`;

      cBlock += `}\n`;

      // Lógica Funcional Avanzada
      if(el.func === 'hover-dropdown') {
        cBlock += `.${el.id} .inner-content { flex-direction: column; position: relative; cursor: pointer; align-items:center; justify-content:center; }\n.${el.id} .sub { display: none; position: absolute; top: 100%; left: 0; width: 100%; background: #fff; box-shadow: 0 10px 25px rgba(0,0,0,0.2); list-style: none; padding: 0; margin: 5px 0 0 0; border-radius: 4px; overflow: hidden; z-index:50; }\n.${el.id}:hover .sub { display: block; }\n.${el.id} .sub li a { display: block; padding: 12px; text-decoration: none; color: #333; border-bottom: 1px solid #eee; }\n.${el.id} .sub li a:hover { background: #f8fafc; }\n`;
      }
      else if(el.func === 'hover-flip') {
        cBlock += `.${el.id} .inner-content { position: relative; width: 100%; height: 100%; transform-style: preserve-3d; transition: transform 0.6s cubic-bezier(0.4, 0.2, 0.2, 1); }\n.${el.id}:hover .inner-content { transform: rotateY(180deg); }\n.${el.id} .front, .${el.id} .back { position: absolute; width: 100%; height: 100%; backface-visibility: hidden; display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 24px; }\n.${el.id} .back { transform: rotateY(180deg); }\n`;
      }
      else if(el.func === 'tooltip') {
        cBlock += `.${el.id} { display:flex; align-items:center; justify-content:center; position: relative; cursor: help; }\n.${el.id}::after { content: "Tooltip Info"; position: absolute; bottom: 120%; left: 50%; transform: translateX(-50%); background: #1e293b; color: #fff; padding: 8px 12px; border-radius: 6px; font-size: 12px; white-space: nowrap; opacity: 0; visibility: hidden; transition: 0.3s; }\n.${el.id}:hover::after { opacity: 1; visibility: visible; bottom: 110%; }\n`;
      }
      else if(el.func === 'css-tabs') {
        cBlock += `.${el.id} .inner-content { flex-direction: column; width: 100%; height: 100%; }\n.${el.id} input[type="radio"] { display: none; }\n.${el.id} .tab-headers { display: flex; border-bottom: 2px solid #e2e8f0; }\n.${el.id} label { padding: 15px 20px; cursor: pointer; color: #64748b; font-weight: bold; transition: 0.2s; }\n.${el.id} .tab-content { display: none; padding: 20px; flex: 1; background: #f8fafc; }\n.${el.id} #t1:checked ~ .tab-headers label[for="t1"], .${el.id} #t2:checked ~ .tab-headers label[for="t2"] { color: #3b82f6; border-bottom: 2px solid #3b82f6; margin-bottom: -2px; }\n.${el.id} #t1:checked ~ .c1 { display: block; }\n.${el.id} #t2:checked ~ .c2 { display: block; }\n`;
      }
      else if(el.func === 'toggle') {
        cBlock += `.${el.id} .inner-content { position: relative; display: inline-block; width: 100%; height: 100%; }\n.${el.id} input { opacity: 0; width: 0; height: 0; }\n.${el.id} .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #ccc; transition: .4s; border-radius: 34px; }\n.${el.id} .slider:before { position: absolute; content: ""; height: calc(100% - 8px); width: calc(100% - 8px); max-width: calc(100% / 2); left: 4px; bottom: 4px; background-color: white; transition: .4s; border-radius: 50%; }\n.${el.id} input:checked + .slider { background-color: ${el.color}; }\n.${el.id} input:checked + .slider:before { transform: translateX(calc(100% - 4px)); }\n`;
      }
      else if(el.func === 'css-carousel') {
        cBlock += `.${el.id} .inner-content { width: 100%; height: 100%; overflow: hidden; }\n.${el.id} .slides { display: flex; width: 300%; height: 100%; animation: slideAnim 9s infinite; }\n.${el.id} .slide { width: 33.33%; height: 100%; display: flex; align-items: center; justify-content: center; font-size: 32px; font-weight: bold; }\n`;
      }
      else if(el.func === 'grid3') {
        cBlock += `.${el.id} .inner-content { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 20px; width: 100%; height: 100%; }\n.${el.id} .inner-content > div { border-radius: 8px; display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 20px; }\n`;
      }
      else if(el.func === 'float-label') {
        cBlock += `.${el.id} .inner-content { position: relative; width: 100%; height: 100%; }\n.${el.id} input { width: 100%; height: 100%; padding: 20px 15px 5px 15px; border: 1px solid #cbd5e1; border-radius: ${el.radius}px; outline: none; font-size:16px; background:transparent; }\n.${el.id} label { position: absolute; top: 50%; left: 15px; transform: translateY(-50%); color: #94a3b8; transition: 0.2s; pointer-events: none; }\n.${el.id} input:focus ~ label, .${el.id} input:valid ~ label { top: 12px; font-size: 11px; color: ${el.color}; }\n.${el.id} input:focus { border-color: ${el.color}; }\n`;
      }

      globalDynamicCSS += cBlock;

      // HTML Interno
      const inner = node.querySelector('.inner-content');
      // No reescribir inputs o componentes complejos interactivos durante edición si no es necesario, pero sí para inicializar
      inner.innerHTML = el.text;
    });

    globalDynamicCSS += `\n@keyframes animFloat { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-15px); } }`;
    globalDynamicCSS += `\n@keyframes animPulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.05); } }`;
    globalDynamicCSS += `\n@keyframes animSpin { 100% { transform: rotateY(360deg); } }`;
    globalDynamicCSS += `\n@keyframes slideAnim { 0%, 25% { transform: translateX(0); } 33%, 58% { transform: translateX(-33.33%); } 66%, 91% { transform: translateX(-66.66%); } 100% { transform: translateX(0); } }`;
    globalDynamicCSS += `\n@keyframes skeletonLoad { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }`;

    dynamicCss.textContent = globalDynamicCSS;
    generateCode(); // Exportador texto
  }

  // 3. FÍSICA DRAG & RESIZE
  function startDrag(e, el, node) {
    if(document.body.classList.contains('interact-mode')) return;
    e.preventDefault();
    let sX = e.clientX, sY = e.clientY;
    function move(ev) {
      el.x += ev.clientX - sX; el.y += ev.clientY - sY;
      sX = ev.clientX; sY = ev.clientY;
      node.style.left = `${el.x}px`; node.style.top = `${el.y}px`;
      updatePropsUI();
    }
    function up() { document.removeEventListener('mousemove', move); document.removeEventListener('mouseup', up); generateCode(); }
    document.addEventListener('mousemove', move); document.addEventListener('mouseup', up);
  }

  function startResize(e, el, node) {
    if(document.body.classList.contains('interact-mode')) return;
    e.preventDefault();
    let sX = e.clientX, sY = e.clientY;
    function move(ev) {
      el.w = Math.max(20, el.w + (ev.clientX - sX)); el.h = Math.max(20, el.h + (ev.clientY - sY));
      sX = ev.clientX; sY = ev.clientY;
      node.style.width = `${el.w}px`; node.style.height = `${el.h}px`;
      updatePropsUI();
    }
    function up() { document.removeEventListener('mousemove', move); document.removeEventListener('mouseup', up); generateCode(); }
    document.addEventListener('mousemove', move); document.addEventListener('mouseup', up);
  }

  // 4. UI LIENZO & PANELES
  // El prompt pidió 5% de opacidad del lienzo por defecto. Esto se llama en el INIT.
  function initCanvas() {
    canvasBg.style.background = '#1a1d27';
    canvasBg.style.opacity = '0.05'; 
  }
  
  function updateCanvas() {
    canvasBg.style.background = document.getElementById('canvas-color').value;
    canvasBg.style.opacity = document.getElementById('canvas-opacity').value / 100;
    generateCode();
  }

  function selectElement(id) { 
    selectedId = id; 
    document.querySelectorAll('.element').forEach(n => n.classList.remove('selected'));
    if(id && document.body.classList.contains('edit-mode')) document.getElementById(id).classList.add('selected');
    updatePropsUI(); 
  }

  canvas.addEventListener('mousedown', (e) => { 
    if(e.target === canvas || e.target === canvasBg) selectElement(null); 
  });

  function updatePropsUI() {
    if(!selectedId) { 
      document.getElementById('canvas-props').style.display='block'; 
      document.getElementById('layer-props').style.display='none'; 
      return; 
    }
    document.getElementById('canvas-props').style.display='none'; 
    document.getElementById('layer-props').style.display='block';
    
    const el = elements.find(e => e.id === selectedId);
    ['x','y','w','h','radius','rotY','rotZ'].forEach(p => document.getElementById(`prop-${p}`).value = Math.round(el[p]));
    document.getElementById('prop-bg').value = el.bg; document.getElementById('prop-color').value = el.color.startsWith('#')?el.color:'#ffffff';
    ['text','style','func','anim'].forEach(p => document.getElementById(`prop-${p}`).value = el[p]);
  }

  function updateElUI() {
    if(!selectedId) return; const el = elements.find(e => e.id === selectedId);
    ['x','y','w','h','radius','rotY','rotZ'].forEach(p => el[p] = parseFloat(document.getElementById(`prop-${p}`).value) || 0);
    ['bg','color','text','style','func','anim'].forEach(p => el[p] = document.getElementById(`prop-${p}`).value);
    applyStylesAndCompile(); 
  }

  function switchTab(t) { document.querySelectorAll('.tab-btn, .tab-content').forEach(e => e.classList.remove('active')); event.target.classList.add('active'); document.getElementById(`tab-${t}`).classList.add('active'); }
  function setViewport(t) { document.querySelectorAll('.viewports button').forEach(b => b.classList.remove('active')); event.target.classList.add('active'); canvas.className = t; }

  // 5. EXPORTADOR DEFINITIVO A HTML/CSS
  function generateCode() {
    let canvasBgColor = document.getElementById('canvas-color').value;
    let canvasOp = document.getElementById('canvas-opacity').value / 100;

    let htmlG = `<div class="pro-layout">\n`;
    
    // TRUCO: Pseudo-elemento para aplicar la opacidad EXACTA del 5% al fondo sin afectar los elementos de arriba
    let cssG = `/* Reset Global */\n* { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, sans-serif; }\n\n.pro-layout {\n  position: relative;\n  width: 100%;\n  min-height: 100vh;\n  overflow-x: hidden;\n  background-color: transparent;\n  perspective: 1500px;\n}\n.pro-layout::before {\n  content: "";\n  position: absolute;\n  inset: 0;\n  background-color: ${canvasBgColor};\n  opacity: ${canvasOp};\n  z-index: -1;\n}\n\n`;

    let stylesRules = dynamicCss.textContent; 

    elements.forEach((el, index) => {
      let attrs = el.attrs ? ` ${el.attrs}` : '';
      if(el.tag === 'img') attrs += ' src="imagen.jpg"';
      
      htmlG += `  <!-- ${el.name} -->\n  <${el.tag} class="${el.id}"${attrs}>\n    <div class="inner-content">\n      ${el.text.replace(/\n/g, '\n      ')}\n    </div>\n  </${el.tag}>\n`;
      
      let wRule = `width: ${Math.round(el.w)}px;`;
      if (el.x === 0 && Math.abs(el.w - canvas.offsetWidth) < 5) wRule = `width: 100%;`;
      
      cssG += `.${el.id} {\n  position: absolute; left: ${Math.round(el.x)}px; top: ${Math.round(el.y)}px; z-index: ${index + 1};\n  ${wRule} height: ${Math.round(el.h)}px;\n`;
      cssG += `}\n\n`;
    });
    
    htmlG += `</div>`;
    cssG += stylesRules; 

    document.getElementById('code-html-global').textContent = htmlG; 
    document.getElementById('code-css-global').textContent = cssG;

    // Componente individual
    if(selectedId) {
      const el = elements.find(e => e.id === selectedId);
      document.getElementById('code-html-single').textContent = `<${el.tag} class="mi-componente">\n  <div class="inner-content">\n    ${el.text.replace(/\n/g, '\n    ')}\n  </div>\n</${el.tag}>`;
      
      let singleCSS = `.mi-componente {\n  width: ${Math.round(el.w)}px; height: ${Math.round(el.h)}px;\n}\n\n`;
      let regex = new RegExp(`\\.${el.id}(.*?)\\{([\\s\\S]*?)\\}`, 'g');
      let match;
      while ((match = regex.exec(stylesRules)) !== null) { singleCSS += `.mi-componente${match[1]} {${match[2]}}\n`; }
      document.getElementById('code-css-single').textContent = singleCSS;
    } else {
      document.getElementById('code-html-single').textContent = '<!-- Selecciona un elemento -->'; document.getElementById('code-css-single').textContent = '/* Selecciona un elemento */';
    }
  }

  function downloadProject() {
    if(elements.length === 0) return alert("El lienzo está vacío.");
    const html = `<!DOCTYPE html>\n<html lang="es">\n<head>\n  <meta charset="UTF-8">\n  <meta name="viewport" content="width=device-width, initial-scale=1.0">\n  <title>Master Pro Layout</title>\n  <link rel="stylesheet" href="style.css">\n</head>\n<body>\n\n${document.getElementById('code-html-global').textContent}\n\n</body>\n</html>`;
    downloadFile('index.html', html); setTimeout(() => downloadFile('style.css', document.getElementById('code-css-global').textContent), 500);
  }
  function downloadFile(f, t) { const a = document.createElement('a'); a.href = 'data:text/plain;charset=utf-8,' + encodeURIComponent(t); a.download = f; a.style.display = 'none'; document.body.appendChild(a); a.click(); document.body.removeChild(a); }

  document.addEventListener('keydown', (e) => { 
    if (!['INPUT','TEXTAREA','SELECT'].includes(e.target.tagName) && (e.key === 'Delete' || e.key === 'Backspace')) {
      if(selectedId && document.body.classList.contains('edit-mode')) { 
        elements = elements.filter(x => x.id !== selectedId); 
        document.getElementById(selectedId).remove(); 
        selectElement(null); applyStylesAndCompile(); 
      }
    }
  });

  // Init Calls
  initCanvas();
  generateCode();
</script>
</body>
</html>
